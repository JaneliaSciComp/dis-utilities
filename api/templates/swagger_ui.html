<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DIS Responder API</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Swagger UI 5.32.14 (vendored under static/swagger-ui5/) renders the OpenAPI 3.1 spec served by /doc. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='swagger-ui5/swagger-ui.css') }}">
  <style>
    html { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="{{ url_for('static', filename='swagger-ui5/swagger-ui-bundle.js') }}" charset="UTF-8"></script>
  <script src="{{ url_for('static', filename='swagger-ui5/swagger-ui-standalone-preset.js') }}" charset="UTF-8"></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: "{{ url_for('get_doc_json') }}",
        dom_id: "#swagger-ui",
        deepLinking: true,
        validatorUrl: null,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
