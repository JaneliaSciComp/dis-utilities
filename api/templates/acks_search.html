{% extends "base.html" %}
{% block script %}
<script>
  // Either pulldown navigates on change. They are alternatives, not a pair, so
  // selecting in one clears the other - otherwise the Look up button would have two
  // answers and no way to tell which the reader meant.
  function go_to_acks_regex(sel) {
    var key = sel.value;
    if (!key) { return; }
    $("select.acksregexkey").not(sel).val("");
    window.location = "/acksregexui/" + encodeURIComponent(key);
  }
  function find_acks_regex() {
    var key = $("#acksregexkey").val() || $("#acksregexlab").val();
    if (!key) {
      alert("You must select a project, department or lab");
      return;
    }
    // search_regex keys map directly to the /acksregexui/<key> result page
    url = "/acksregexui/" + encodeURIComponent(key);
    window.location = url;
  }
</script>
{% endblock %}

{% block content %}
<h2>Search acknowledgements by project, department or lab</h2>
<span style='color:goldenrod'><i class='fa-solid fa-warning'></i>This feature is experimental</span><br><br>
<form onsubmit="find_acks_regex(); return false;">
<div class="flexcontainer">
  <div class="flexitem">
  <span class="form-control-lg">Project or department:</span>
  </div>
  <div class="flexitem">
    <select class="form-control form-control-lg acksregexkey" id="acksregexkey" onchange="go_to_acks_regex(this);">
      {{ keys | safe }}
    </select>
  </div>
</div>
<div class="flexcontainer">
  <div class="flexitem">
  <span class="form-control-lg">Lab:</span>
  </div>
  <div class="flexitem">
    <select class="form-control form-control-lg acksregexkey" id="acksregexlab" onchange="go_to_acks_regex(this);">
      {{ labs | safe }}
    </select>
  </div>
  <div class="flexitem">
    <button type="submit" id="acksregexb" class="btn btn-primary" onclick="find_acks_regex(); return false;" href="#">Look up</button>
  </div>
</div>
</form>
{% endblock %}
