{% extends "base.html" %}
{% block script %}
<script>
  // Either pulldown navigates on change; there is no submit step. They are
  // alternatives, not a pair, so selecting in one clears the other - a stale value
  // left behind in the other would be misleading on the way back.
  // search_regex keys map directly to the /acksregexui/<key> result page.
  function go_to_acks_regex(sel) {
    var key = sel.value;
    if (!key) { return; }
    $("select.acksregexkey").not(sel).val("");
    window.location = "/acksregexui/" + encodeURIComponent(key);
  }
</script>
{% endblock %}

{% block content %}
<h2>Search acknowledgements by project, department or lab</h2>
<span style='color:goldenrod'><i class='fa-solid fa-warning'></i>This feature is experimental</span><br><br>
<form onsubmit="return false;">
<div class="flexcontainer">
  <div class="flexitem">
  <span class="form-control-lg">Project or department:</span>
  </div>
  <div class="flexitem">
    <select class="form-control form-control-lg acksregexkey" id="acksregexkey" onchange="go_to_acks_regex(this);">
      {{ keys | safe }}
    </select>
  </div>
</div>
<div class="flexcontainer">
  <div class="flexitem">
  <span class="form-control-lg">Lab:</span>
  </div>
  <div class="flexitem">
    <select class="form-control form-control-lg acksregexkey" id="acksregexlab" onchange="go_to_acks_regex(this);">
      {{ labs | safe }}
    </select>
  </div>
</div>
</form>
{% endblock %}
