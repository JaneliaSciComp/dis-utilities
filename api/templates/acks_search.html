{% extends "base.html" %}
{% block script %}
<script>
  // Either pulldown navigates on change; there is no submit step. They are
  // alternatives, not a pair, so selecting in one clears the other - a stale value
  // left behind in the other would be misleading on the way back.
  // search_regex keys map directly to the /acksregexui/<key> result page.
  function go_to_acks_regex(sel) {
    var key = sel.value;
    if (!key) { return; }
    // The two modes do not find the same DOIs, so the choice travels with the
    // search rather than being decided for the reader on the results page.
    var modes = [];
    if ($("#match_text").is(":checked")) { modes.push("text"); }
    if ($("#match_tag").is(":checked")) { modes.push("tag"); }
    if (!modes.length) {
      alert("Choose at least one of \"Acknowledgement text mentions it\" or " +
            "\"Tagged with this entity\".");
      sel.value = "";
      return;
    }
    $("select.acksregexkey").not(sel).val("");
    window.location = "/acksregexui/" + encodeURIComponent(key) +
                      "?match=" + modes.join(",");
  }
</script>
{% endblock %}

{% block content %}
<h2>Search acknowledgements by project, department or lab</h2>
<form onsubmit="return false;">
<div class="flexcontainer">
  <div class="flexitem">
  <span class="form-control-lg">Project or department:</span>
  </div>
  <div class="flexitem">
    <select class="form-control form-control-lg acksregexkey" id="acksregexkey" onchange="go_to_acks_regex(this);">
      {{ keys | safe }}
    </select>
  </div>
</div>
<div class="flexcontainer" style="margin-top:14px;">
  <div class="flexitem">
  <span class="form-control-lg">Lab:</span>
  </div>
  <div class="flexitem">
    <select class="form-control form-control-lg acksregexkey" id="acksregexlab" onchange="go_to_acks_regex(this);">
      {{ labs | safe }}
    </select>
  </div>
</div>
<div style="margin-top:18px;">
  <div style="margin-bottom:6px;">Search for:</div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" id="match_text" checked>
    <label class="form-check-label" for="match_text">
      <b>Mentions in the acknowledgement</b> &mdash; the acknowledgement text we hold
      names the project, department or lab.
    </label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" id="match_tag" checked>
    <label class="form-check-label" for="match_tag">
      <b>Tagged with it</b> &mdash; the entity was recorded on the DOI, by the tagger or
      by a curator. This also finds DOIs whose acknowledgement text we do not hold, and
      ones tagged before the search pattern last changed.
    </label>
  </div>
</div>
</form>
{% endblock %}
