[pytest]
# update_dois.py is a script, not a package; put its directory on the path so
# tests can import it. Run with: pytest  (from the repository root)
# api/ holds dis_html, whose escaping the XSS regression tests pin down. It
# pulls in only the standard library plus its two local siblings, so adding
# it costs the test run no new dependency.
pythonpath = sync/bin sync/maintenance/bin api
testpaths = tests
