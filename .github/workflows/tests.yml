# Runs the update_dois.py unit suite (tests/) on every pull request and on
# pushes to main. update_dois.py is the only path by which DOIs are inserted or
# updated, so a regression there is expensive; the suite is fast and hermetic,
# and makes no network or database calls.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets the suite be run on demand from the Actions tab, against any branch.
  # Useful for changes to this workflow itself, which the push/pull_request
  # triggers only exercise once a PR exists.
  workflow_dispatch:

# A new push to a branch supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-dois:
    name: update_dois (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two interpreters this code actually runs on: 3.10 matches the
        # sync/bin venv, 3.12 matches the sync container (python:3.12.7).
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # tests/conftest.py stubs any dependency it cannot import, so the suite
      # will run with pytest alone - but it would then exercise the stubs
      # instead of the real code. doi_common in particular supplies both
      # is_datacite (registrar routing) and get_publishing_date (the too_old
      # cutoff), and with those stubbed four persistence tests fail. Install the
      # real libraries so CI tests what production runs. Both are public, so no
      # credentials are needed; requests and the rest arrive transitively.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest \
            "git+https://github.com/JaneliaSciComp/jrc_common.git" \
            "git+https://github.com/JaneliaSciComp/doi_common.git"

      - name: Report versions
        run: pip list

      - name: Run tests
        env:
          # doi_common reads this at import time to configure pyalex. These
          # tests make no API calls, so the value is never used - but the import
          # raises KeyError without it.
          OPENALEX_API_KEY: unused-by-these-tests
        run: pytest -v
